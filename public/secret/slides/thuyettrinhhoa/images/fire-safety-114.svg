<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180">
  <rect width="680" height="180" fill="#FFFFFF" rx="8" />
  <g transform="translate(16,18)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="150" height="144" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" />
    <text x="75" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#DC2626">BƯỚC 01</text>
    <text x="75" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#111827">BÁO ĐỘNG</text>
    <text x="75" y="78" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">Hô hoán lớn, bấm</text>
    <text x="75" y="96" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">chuông báo cháy</text>
    <text x="75" y="114" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">cho mọi người</text>
    <!-- Step 2 -->
    <rect x="166" y="0" width="150" height="144" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" />
    <text x="241" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#D97706">BƯỚC 02</text>
    <text x="241" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#111827">CẮT ĐIỆN</text>
    <text x="241" y="78" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">Ngắt cầu dao tổng</text>
    <text x="241" y="96" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">tránh điện giật và</text>
    <text x="241" y="114" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">chập lan đám cháy</text>
    <!-- Step 3 -->
    <rect x="332" y="0" width="150" height="144" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.8" />
    <text x="407" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0F766E">BƯỚC 03</text>
    <text x="407" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#111827">DẬP LỬA</text>
    <text x="407" y="78" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">Dùng bình bột / CO₂,</text>
    <text x="407" y="96" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">cát, chăn ướt phù</text>
    <text x="407" y="114" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">hợp bản chất cháy</text>
    <!-- Step 4 -->
    <rect x="498" y="0" width="150" height="144" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2" />
    <text x="573" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#DC2626">BƯỚC 04</text>
    <text x="573" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#111827">GỌI 114</text>
    <text x="573" y="78" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">Thoát hiểm an toàn</text>
    <text x="573" y="96" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">và báo chính xác</text>
    <text x="573" y="114" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="11.5" fill="#4B5563">địa chỉ, chất cháy</text>
  </g>
</svg>
