<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" fill="#F8FAFC" rx="8" />
  <!-- Left: Gasoline Spark Ignition Engine -->
  <g transform="translate(30,24)">
    <rect x="0" y="0" width="315" height="292" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="157" y="28" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#D97706">ĐỘNG CƠ XĂNG (BUGI ĐÁNH LỬA)</text>
    <text x="157" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4B5563">Tỉ số nén thấp (8:1 – 11:1) · Đốt mồi tia lửa</text>
    <!-- Cylinder Wall -->
    <rect x="92" y="72" width="130" height="168" fill="#FFFBEB" stroke="#334155" stroke-width="3" />
    <!-- Spark Plug -->
    <rect x="148" y="54" width="18" height="24" fill="#64748B" stroke="#1E293B" stroke-width="1.5" />
    <line x1="157" y1="78" x2="157" y2="90" stroke="#1E293B" stroke-width="2" />
    <!-- Spark Flash -->
    <polygon points="157,91 143,103 153,103 145,116 168,101 158,101" fill="#F59E0B" stroke="#DC2626" stroke-width="1" />
    <!-- Flame front -->
    <ellipse cx="157" cy="126" rx="46" ry="22" fill="#FDE68A" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="157" y="130" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#B45309">TIA LỬA BUGI</text>
    <!-- Piston -->
    <rect x="96" y="160" width="122" height="46" rx="3" fill="#CBD5E1" stroke="#334155" stroke-width="2" />
    <rect x="147" y="206" width="20" height="34" fill="#94A3B8" stroke="#334155" stroke-width="1.5" />
    <text x="157" y="264" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="700" fill="#111827">Tự bốc cháy cao (~280°C) tránh kích nổ</text>
    <text x="157" y="281" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#D97706">Flash Point: -43°C → Hơi xăng bay hơi sẵn</text>
  </g>
  <!-- Right: Diesel Compression Ignition Engine -->
  <g transform="translate(375,24)">
    <rect x="0" y="0" width="315" height="292" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="157" y="28" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#0F766E">ĐỘNG CƠ DIESEL (NÉN TỰ BỐC CHÁY)</text>
    <text x="157" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4B5563">Tỉ số nén cao (16:1 – 22:1) · Không có bugi</text>
    <!-- Cylinder Wall -->
    <rect x="92" y="72" width="130" height="168" fill="#FEF2F2" stroke="#334155" stroke-width="3" />
    <!-- Fuel Injector -->
    <polygon points="150,54 164,54 160,84 154,84" fill="#0F766E" stroke="#1E293B" stroke-width="1.5" />
    <!-- Spray mist -->
    <line x1="157" y1="84" x2="122" y2="118" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="157" y1="84" x2="157" y2="122" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="157" y1="84" x2="192" y2="118" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Autoignition thermal cloud -->
    <ellipse cx="157" cy="126" rx="52" ry="22" fill="#FECACA" stroke="#DC2626" stroke-width="1.5" />
    <text x="157" y="123" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#991B1B">KHÍ NÉN &gt; 550°C</text>
    <text x="157" y="135" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#DC2626">TỰ BỐC CHÁY TỨC THÌ</text>
    <!-- Piston -->
    <rect x="96" y="156" width="122" height="50" rx="3" fill="#CBD5E1" stroke="#334155" stroke-width="2" />
    <rect x="147" y="206" width="20" height="34" fill="#94A3B8" stroke="#334155" stroke-width="1.5" />
    <text x="157" y="264" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="12" font-weight="700" fill="#111827">Tự bốc cháy thấp (~210°C) dễ tự phát lửa</text>
    <text x="157" y="281" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#0F766E">Flash Point: &gt; 52°C → Phun sương mới cháy</text>
  </g>
</svg>
