<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <rect width="700" height="360" fill="#F8FAFC" rx="8" />
  <!-- Ground line -->
  <line x1="20" y1="318" x2="680" y2="318" stroke="#94A3B8" stroke-width="2" />
  <!-- Tanker chassis & wheels -->
  <rect x="95" y="246" width="490" height="22" rx="4" fill="#475569" />
  <circle cx="170" cy="282" r="32" fill="#1E293B" stroke="#94A3B8" stroke-width="4" />
  <circle cx="170" cy="282" r="14" fill="#CBD5E1" />
  <circle cx="445" cy="282" r="32" fill="#1E293B" stroke="#94A3B8" stroke-width="4" />
  <circle cx="445" cy="282" r="14" fill="#CBD5E1" />
  <circle cx="525" cy="282" r="32" fill="#1E293B" stroke="#94A3B8" stroke-width="4" />
  <circle cx="525" cy="282" r="14" fill="#CBD5E1" />
  <!-- Tank Cutaway Shell -->
  <rect x="88" y="88" width="510" height="162" rx="56" fill="#FFFFFF" stroke="#334155" stroke-width="5" />
  <!-- Vapor + Air Inside Closed Tank -->
  <rect x="102" y="102" width="482" height="134" rx="44" fill="#FEF3C7" fill-opacity="0.7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4" />
  <!-- Welding Lid Hatch -->
  <rect x="292" y="72" width="104" height="22" rx="4" fill="#94A3B8" stroke="#1E293B" stroke-width="2.5" />
  <!-- Welding Torch & Heat Arc -->
  <line x1="418" y1="28" x2="352" y2="72" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  <circle cx="348" cy="74" r="16" fill="#FDE047" opacity="0.85" />
  <polygon points="348,54 355,68 370,66 356,76 364,90 348,80 334,90 340,76 326,66 341,68" fill="#DC2626" />
  <text x="432" y="34" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#DC2626">HÀN XÌ (~1700–1800°C)</text>
  <!-- Thermal conduction arrows through steel lid -->
  <path d="M325,94 L325,130 M348,94 L348,136 M371,94 L371,130" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 3" />
  <polygon points="348,142 342,130 354,130" fill="#DC2626" />
  <!-- 3 Factors Callouts inside Tank -->
  <g font-family="Be Vietnam Pro, sans-serif">
    <rect x="122" y="148" width="142" height="68" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
    <text x="193" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">1. HƠI XĂNG TỒN DƯ</text>
    <text x="193" y="191" text-anchor="middle" font-size="11" fill="#4B5563">Dù đã tháo cạn lỏng</text>
    <text x="193" y="206" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#D97706">Pha hơi kẹt trong bồn</text>

    <rect x="278" y="148" width="144" height="68" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <text x="350" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">2. TRUYỀN NHIỆT KÍN</text>
    <text x="350" y="191" text-anchor="middle" font-size="11" fill="#4B5563">Đạt T° tự bốc cháy</text>
    <text x="350" y="206" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#DC2626">T ≥ 280°C → NỔ ÁP SUẤT</text>

    <rect x="436" y="148" width="132" height="68" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5" />
    <text x="502" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">3. OXYGEN KHÔNG KHÍ</text>
    <text x="502" y="191" text-anchor="middle" font-size="11" fill="#4B5563">~21% O₂ có sẵn</text>
    <text x="502" y="206" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#0F766E">Đủ 3 đỉnh Tam giác cháy</text>
  </g>
</svg>
